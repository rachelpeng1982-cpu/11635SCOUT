<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b2539"><title>童軍接駁助手</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1727;color:#f5fafc;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;padding:20px 16px 100px}main{max-width:600px;margin:auto}h1{font-size:26px;margin:4px 0 8px}.sub,.note{color:#afc5d3;font-size:13px;line-height:1.65}.pill{display:inline-block;background:#164b4d;color:#89f3dd;border-radius:20px;padding:7px 12px;font-size:12px}.card{background:#142c3d;border:1px solid #285065;border-radius:18px;padding:17px;margin:14px 0}h2{font-size:18px;margin:8px 0}.eta{font-size:43px;font-weight:750;color:#64e3c8;font-variant-numeric:tabular-nums}.muted{color:#a9bdc9}.btn{background:#36d1b5;color:#092b34;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:750;cursor:pointer}.btn.secondary{background:#234b63;color:white}.btn.light{background:transparent;border:1px solid #537083;color:white}.btn:disabled{opacity:.4}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions>*{flex:1}input{width:100%;background:#102335;border:1px solid #5a7890;border-radius:10px;padding:12px;color:white;font-size:16px}.stop{border-left:3px solid #3b7086;padding:9px 0 10px 15px;margin:10px 0}.stop.done{border-color:#36d1b5}.stop.current{border-color:#ffcc79}.line{font-weight:700}.tiny{font-size:12px;color:#b3c5ce;margin:5px 0}.clock{font-variant-numeric:tabular-nums}a{color:#8cead5;text-decoration:none}details{margin-top:8px}summary{cursor:pointer;font-weight:700}.leg{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}.leg input{width:95px}.fixed{position:fixed;bottom:0;left:0;right:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#0b1727ee;border-top:1px solid #29495a}.fixed>div{display:flex;gap:10px;max-width:600px;margin:auto}.fixed .btn{flex:1}label{font-size:13px}.label{color:#86a8ba;font-size:12px}</style></head><body><main><div class="pill" id="status">尚未出發</div><h1>🚐 童軍接駁助手</h1><p class="sub">11/28 朝威 06:00 出發、07:00 抵達家豪家；家豪 07:15 接手，08:30 抵達士林。請停車後再操作。</p><div class="card" id="hero"></div><div class="card" id="startCard"><h2>設定出發時間</h2><input id="startTime" type="datetime-local"><div class="actions"><button class="btn" id="startNow">🚐 現在出發</button><button class="btn secondary" id="startSelected">使用選定時間</button></div></div><section class="card"><h2>📍 接駁進度</h2><div id="stops"></div></section><section class="card"><details><summary>⚙️ 調整各段預估車程／分享紀錄</summary><p class="note">Google Maps 導航會另開新頁；目前無法直接讀取 Google 即時交通，ETA 按手動設定分鐘數計算。</p><div id="legEditors"></div><div class="actions"><button class="btn secondary" id="share">複製／分享行程紀錄</button><button class="btn light" id="reset">重新開始</button></div><p class="note">本版本以瀏覽器本機保存紀錄；分享網址不會同步司機的實際按鈕紀錄，雲端共用需另外建置後端。</p></details></section><p class="note">導航路線及車程僅供參考。受訓地點目前依截圖先以「臺北市士林區平菁街」標示，正式出發前應確認完整門牌。</p></main><div class="fixed"><div><button class="btn secondary" id="nav">🗺️ 下一站導航</button><button class="btn" id="action">🚐 現在出發</button></div></div><script>
const STOPS=[
{place:"遠東百貨竹北店",who:"徐朝威（司機）",addr:"新竹縣竹北市莊敬北路18號",min:0},
{place:"豐邑文心匯",who:"宜寬團長",addr:"新竹市東區慈雲路 豐邑文心匯",min:14},
{place:"全家便利商店 新竹新武陵店",who:"姿伊、宜瑾",addr:"新竹市北區武陵路267號",min:16},
{place:"公道五路五段",who:"智純",addr:"新竹市公道五路五段",min:9},
{place:"新豐綠景莊園132社區",who:"家豪",addr:"新竹縣新豐鄉綠景莊園132社區",min:21},
{place:"士林受訓場地",who:"全員抵達",addr:"臺北市士林區平菁街",min:75}
];
const KEY="scout-shuttle-2026-11-28";
let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){state={}};state={start:state.start||null,arrivals:state.arrivals||{},boarded:state.boarded||{},mins:Array.isArray(state.mins)&&state.mins.length===6?state.mins:STOPS.map(s=>s.min)};
const PLAN_START="2026-11-28T06:00:00+08:00";const PLAN_TRANSFER="2026-11-28T07:00:00+08:00";const PLAN_STAGE2="2026-11-28T07:15:00+08:00";const PLAN_END="2026-11-28T08:30:00+08:00";const el=id=>document.getElementById(id), save=()=>localStorage.setItem(KEY,JSON.stringify(state)), time=t=>new Date(t).toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit",hour12:false}), fmt=t=>new Date(t).toLocaleString("zh-TW",{hour12:false}), add=(t,m)=>new Date(new Date(t).getTime()+m*60000).toISOString(), navurl=i=>"https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(STOPS[i].addr)+"&travelmode=driving";
function next(){if(!state.start)return 0;for(let i=1;i<6;i++)if(!state.boarded[i])return i;return 6}
function eta(i){let n=next();if(!state.start||i<n)return null;let at=n===1?state.start:state.boarded[n-1];for(let k=n;k<=i;k++){if(k===5){const earliest=add(at,15);at=new Date(earliest)>new Date(PLAN_STAGE2)?earliest:PLAN_STAGE2;}at=add(at,state.mins[k])}return at}
function start(selected){if(state.start)return;let d=selected?new Date(el("startTime").value):new Date();if(isNaN(+d))return alert("請設定有效時間");state.start=d.toISOString();state.boarded[0]=state.start;save();render()}
function arrive(i){if(next()!==i)return;state.arrivals[i]=new Date().toISOString();save();render()}
function board(i){if(next()!==i)return;const now=new Date().toISOString();state.arrivals[i]??=now;state.boarded[i]=now;save();render()}
function navigate(){const n=next();if(n===6)return alert("已抵達終點");window.open(navurl(Math.max(1,n)),"_blank","noopener")}
function render(){const n=next(),done=n===6;el("status").textContent=done?"✅ 全員抵達":state.start?"🟢 接駁進行中":"尚未出發";el("startCard").hidden=!!state.start;const current=STOPS[Math.min(n,5)];el("hero").innerHTML=done?'<p class="label">行程已完成</p><div class="eta">✅ 抵達</div><h2>臺北士林受訓場地</h2><p>實際抵達：'+time(state.boarded[5])+'</p>':state.start?'<p class="label">下一站 · '+n+'/5</p><h2>'+current.place+'</h2><p>'+current.who+'</p><p class="label" style="margin-top:13px">預估抵達（非即時交通）</p><div class="eta">'+time(eta(n))+'</div><p class="tiny">上一站實際出發：'+time(n===1?state.start:state.boarded[n-1])+' ｜ 估計 '+state.mins[n]+' 分鐘</p>':'<p class="label">目前狀態</p><h2>預定 11/28 06:00 朝威出發</h2><p class="muted">11/28 06:00 竹北出發 → 07:00 新豐換車 → 07:15 家豪出發 → 08:30 士林抵達</p>';el("stops").innerHTML=STOPS.map((s,i)=>{let actual=i===0?state.start:state.boarded[i];let active=n===i;let t=actual?"實際："+fmt(actual):(state.start&&i>=n?"預估："+fmt(eta(i)):"尚未到站");return '<div class="stop '+(actual?"done":active?"current":"")+'"><div class="line">'+(i+1)+". "+s.place+'</div><div class="tiny">'+s.who+'</div><div class="tiny clock">'+t+'</div>'+(active&&i>0?'<div class="actions">'+(!state.arrivals[i]?'<button class="btn secondary" data-arrive="'+i+'">📍 已抵達</button>':'<span class="tiny">抵達 '+time(state.arrivals[i])+'</span>')+'<button class="btn" data-board="'+i+'">'+(i===5?"🏁 完成行程":"✅ 已上車／下一站")+'</button></div>':"")+'</div>'}).join("");document.querySelectorAll("[data-arrive]").forEach(x=>x.onclick=()=>arrive(+x.dataset.arrive));document.querySelectorAll("[data-board]").forEach(x=>x.onclick=()=>board(+x.dataset.board));el("action").textContent=done?"✅ 行程完成":!state.start?"🚐 現在出發":state.arrivals[n]?"✅ 已上車／下一站":"📍 抵達目前站";el("action").disabled=done;el("nav").disabled=done;el("legEditors").innerHTML=STOPS.slice(1).map((s,j)=>'<div class="leg"><label>'+(j+1)+' → '+(j+2)+'　'+s.place+'</label><input type="number" min="1" max="300" data-min="'+(j+1)+'" value="'+state.mins[j+1]+'"></div>').join("");document.querySelectorAll("[data-min]").forEach(x=>x.onchange=()=>{let v=Math.max(1,Math.min(300,Number(x.value)||1));state.mins[+x.dataset.min]=v;save();render()})}
el("action").onclick=()=>{const n=next();if(!state.start)start(false);else if(n<6){if(!state.arrivals[n])arrive(n);else board(n)}};el("nav").onclick=navigate;el("startNow").onclick=()=>start(false);el("startSelected").onclick=()=>start(true);el("reset").onclick=()=>{if(confirm("確定清除這台手機上的接駁紀錄？")){localStorage.removeItem(KEY);location.reload()}};el("share").onclick=async()=>{let t="童軍接駁行程紀錄\n"+STOPS.map((s,i)=>(i+1)+". "+s.place+"｜"+s.who+"｜"+(i===0?state.start:state.boarded[i])?((i+1)+". "+s.place+"｜"+s.who+"｜"+(i===0?state.start:state.boarded[i]?fmt(i===0?state.start:state.boarded[i]):"未完成")):"").join("\n");t="童軍接駁行程紀錄\n"+STOPS.map((s,i)=>(i+1)+". "+s.place+"｜"+s.who+"｜"+(i===0?state.start:state.boarded[i]?fmt(i===0?state.start:state.boarded[i]):"未完成")).join("\n");try{if(navigator.share)await navigator.share({title:"童軍接駁進度",text:t});else{await navigator.clipboard.writeText(t);alert("紀錄已複製")}}catch(e){if(e.name!=="AbortError")prompt("複製下列紀錄",t)}};el("startTime").value="2026-11-28T06:00";render();
</script></body></html>
